<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager</title>
  </head>
  <body>
    <!-- Inject Decap CMS Core Script -->
    <script src="https://jsdelivr.net"></script>
    <script>
      // Forces the browser to look inside the correct folder path for config.yml
      window.CMS_CONFIG = {
        config: {
          backend: {
            name: "github",
            repo: "kebim/learn-site",
            branch: "main",
            base_url: "https://learnkebim.mibekebim.workers.dev",
            auth_endpoint: "/auth"
          }
        }
      };
    </script>
  </body>
</html>
