<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager</title>
    </script>
  </head>
  <body>
    <script>
      // Tells the script to look below for configuration instead of config.yml
      window.CMS_MANUAL_INIT = true;
    </script>
    
    <script src="https://jsdelivr.net"></script>

    <script>
      CMS.init({
        config: {
          backend: {
            name: "github",
            repo: "kebim/learn-site",
            branch: "main",
            base_url: "https://learnkebim.mibekebim.workers.dev",
            auth_endpoint: "/auth"
          },
          display_url: "https://learn.mibekpandey.com.np",
          publish_mode: "simple",
          media_folder: "images/uploads",
          public_folder: "/images/uploads",
          collections: [
            {
              name: "lessons",
              label: "Teaching Materials",
              folder: "lessons",
              create: true,
              slug: "{{slug}}",
              fields: [
                { label: "Title", name: "title", widget: "string" },
                { label: "Publish Date", name: "date", widget: "datetime" },
                { label: "Subject/Topic", name: "topic", widget: "string" },
                { label: "Lesson Body", name: "body", widget: "markdown" }
              ]
            }
          ]
        }
      });
    </script>
  </body>
</html>
