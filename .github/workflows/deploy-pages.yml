name: Deploy Learn to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
      - name: Configure public site links
        run: |
          cat > .env.production.local << 'EOF'
          VITE_SITE_MODE=learn
          VITE_LEARN_SITE_URL=${{ vars.LEARN_SITE_URL }}
          VITE_TECH_SITE_URL=${{ vars.TECH_SITE_URL }}
          EOF
      - name: Build Learn site
        run: pnpm build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
